[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-bugbounty-harness"
version = "0.2.0"
description = "The triage 'brain' of an authorized web bug-bounty testing pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []            # core runs on the standard library
license = { text = "MIT" }

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]       # train/evaluate/classify --classifier
enrich = ["requests>=2.31"]      # EPSS / CISA KEV / NVD feeds
all = ["scikit-learn>=1.3", "requests>=2.31"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["data/*.json"]
